[package]
name = "services"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "services"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
poem = "1"
poem-openapi = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }


