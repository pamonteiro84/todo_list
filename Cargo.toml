[package]
name = "todo_list"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
poem = "1"
poem-openapi = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }

migration = { path = "./migration", version  = "0.1.0" }
api = { path = "./api", version = "0.1.0" }
services = { path = "./services", version = "0.1.0" }

[workspace]
members = [
    ".",
    "migration",
    "api",
    "services",
]
    